<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>竞彩足球预测</title>
<script>try{if(localStorage.getItem('jc_theme'))document.documentElement.dataset.theme=localStorage.getItem('jc_theme');}catch(e){}</script>
<style>
/* ============ Reset & Tokens ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
:root,html[data-theme="dark"]{
  --bg:#0a0e13; --bg-2:#0d1220; --surface:#11161d; --surface-2:#171e28; --surface-3:#1e2836;
  --border:rgba(148,168,196,.12); --border-2:rgba(148,168,196,.22);
  --text:#e7edf5; --text-sub:#93a1b4; --text-dim:#5f6d80;
  --primary:#00c853; --primary-strong:#00e676; --primary-dim:rgba(0,200,83,.14);
  --warn:#ffb020; --info:#4dabf7; --danger:#ff4757;
  --hit:#ff4757; --miss:#00c853;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow-md:0 6px 18px rgba(0,0,0,.4); --shadow-lg:0 14px 40px rgba(0,0,0,.55);
  --tabbar-h:64px;
}
html[data-theme="light"]{
  --bg:#eef2f7; --bg-2:#e7edf4; --surface:#ffffff; --surface-2:#f4f7fb; --surface-3:#e9eef6;
  --border:rgba(15,23,42,.09); --border-2:rgba(15,23,42,.16);
  --text:#16202e; --text-sub:#5c6b7d; --text-dim:#8a97a8;
  --primary:#00a84f; --primary-strong:#008f44; --primary-dim:rgba(0,168,79,.12);
  --warn:#e8960c; --info:#3b82f6; --danger:#ef4444;
  --hit:#e5484d; --miss:#12a150;
  --shadow-sm:0 1px 2px rgba(20,30,50,.06); --shadow-md:0 6px 18px rgba(20,30,50,.1); --shadow-lg:0 14px 40px rgba(20,30,50,.14);
}
html{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","HarmonyOS Sans SC","MiSans","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(1200px 800px at 50% -10%,var(--bg-2),var(--bg) 60%);
  color:var(--text); font-size:14px; line-height:1.5; overflow:hidden;
}
html[data-theme="light"] body{background:radial-gradient(1200px 800px at 50% -10%,#f8fafd,var(--bg) 60%)}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:0;height:0}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
input{font-family:inherit;border:0;outline:0;background:none;color:var(--text)}

/* ============ App Shell ============ */
#app{position:relative;max-width:430px;margin:0 auto;min-height:100dvh;height:100dvh;overflow:hidden;
  border-left:1px solid var(--border);border-right:1px solid var(--border)}
#view{position:absolute;inset:0 0 calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px)) 0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.page{min-height:100%;padding:0 0 20px;animation:pageIn .28s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ Bottom Tabbar ============ */
#tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;height:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px));
  padding:6px 8px env(safe-area-inset-bottom,0px);display:flex;z-index:50;
  background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--border)}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-dim);
  font-size:11px;font-weight:500;border-radius:12px;transition:color .2s;position:relative}
.tab-btn .ic{transition:transform .2s}
.tab-btn.on{color:var(--primary)}
.tab-btn.on .ic{transform:translateY(-1px)}
.tab-btn.on::after{content:"";position:absolute;top:2px;width:16px;height:3px;border-radius:3px;background:var(--primary)}

/* ============ Shared components ============ */
.sec{margin:14px 14px 0}
.sec-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin:0 0 10px}
.sec-title .bar{width:3px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--primary-strong),var(--primary))}
.sec-title .more{margin-left:auto;font-size:12px;color:var(--text-sub);font-weight:400}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-sm)}
.card-pad{padding:14px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;background:var(--surface-2);border:1px solid var(--border);color:var(--text-sub)}
.chip.g{color:var(--primary);border-color:color-mix(in srgb,var(--primary) 35%,transparent);background:var(--primary-dim)}
.chip.r{color:var(--hit);border-color:color-mix(in srgb,var(--hit) 35%,transparent);background:color-mix(in srgb,var(--hit) 10%,transparent)}
.chip.y{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
.pill.hit{background:color-mix(in srgb,var(--hit) 14%,transparent);color:var(--hit);border:1px solid color-mix(in srgb,var(--hit) 38%,transparent)}
.pill.miss{background:color-mix(in srgb,var(--miss) 14%,transparent);color:var(--miss);border:1px solid color-mix(in srgb,var(--miss) 38%,transparent)}
.tag{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:22px;padding:0 6px;border-radius:6px;font-size:11px;font-weight:700;background:var(--surface-3);color:var(--text-sub)}
.tag.w{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary)}
.tag.d{background:color-mix(in srgb,var(--text-dim) 22%,transparent);color:var(--text-sub)}
.tag.l{background:color-mix(in srgb,var(--hit) 16%,transparent);color:var(--hit)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:44px 20px;color:var(--text-dim);text-align:center}
.empty .ic{opacity:.5}
.empty p{font-size:13px;line-height:1.7}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--hit);display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28);color:var(--primary-strong)}100%{transform:scale(1)}}
.pop{animation:pop .6s ease}

/* stagger reveal */
.page .rv{animation:rv .4s ease both}
.rv:nth-child(2){animation-delay:.05s}.rv:nth-child(3){animation-delay:.1s}.rv:nth-child(4){animation-delay:.15s}.rv:nth-child(5){animation-delay:.2s}.rv:nth-child(6){animation-delay:.25s}
@keyframes rv{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============ 赛事中心 ============ */
.mtop{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.mbrand{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mbrand .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--primary-strong),var(--primary));display:grid;place-items:center;color:#04140b;flex:none}
.mbrand h1{font-size:17px;font-weight:800;letter-spacing:.5px}
.mbrand .live-sum{margin-left:auto;font-size:11px;color:var(--text-sub);display:flex;align-items:center;gap:5px}
.searchbar{position:relative;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:9px 12px}
.searchbar:focus-within{border-color:color-mix(in srgb,var(--primary) 45%,transparent);box-shadow:0 0 0 3px var(--primary-dim)}
.searchbar .ic{color:var(--text-dim);flex:none}
.searchbar input{flex:1;font-size:14px;background:none}
.searchbar input::placeholder{color:var(--text-dim)}
.searchbar .clear{color:var(--text-dim);display:none}
.searchbar.has .clear{display:block}
.search-panel{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 100px);z-index:40;background:var(--surface);border:1px solid var(--border-2);border-radius:16px;box-shadow:var(--shadow-lg);max-height:56vh;overflow-y:auto;display:none;padding:8px}
.search-panel.show{display:block;animation:pageIn .18s ease}
.sp-group{padding:8px 8px 4px}
.sp-group h4{font-size:11px;color:var(--text-dim);font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.sp-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer}
.sp-item:hover,.sp-item.hl{background:var(--surface-2)}
.sp-item .avatar{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff;font-size:12px;font-weight:700;background:linear-gradient(135deg,#334155,#1e293b)}
.sp-item .t1{font-size:13px;font-weight:600}
.sp-item .t2{font-size:11px;color:var(--text-sub)}
.sp-item .go{margin-left:auto;color:var(--text-dim)}
.sp-backdrop{position:fixed;inset:0;z-index:30;display:none}
.sp-backdrop.show{display:block}
.catbar{display:flex;gap:6px;padding:12px 14px 2px}
.catbar .cat{flex:1;text-align:center;padding:8px 0 10px;font-size:14px;font-weight:600;color:var(--text-sub);position:relative;border-radius:10px;transition:color .2s}
.catbar .cat .cnt{font-size:10px;font-weight:700;margin-left:3px;color:var(--text-dim)}
.catbar .cat.on{color:var(--text)}
.catbar .cat.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:2px;width:22px;height:3px;border-radius:3px;background:var(--primary)}
.catbar .cat.on .cnt{color:var(--primary)}
.filter-chip{display:flex;align-items:center;gap:6px;margin:10px 14px 0;padding:7px 12px;background:var(--primary-dim);border:1px solid color-mix(in srgb,var(--primary) 35%,transparent);border-radius:10px;font-size:12px;color:var(--primary);font-weight:600}
.filter-chip b{flex:1}
.lg-group{margin:12px 14px 0}
.lg-head{display:flex;align-items:center;gap:8px;padding:0 2px 8px}
.lg-head .dot{width:8px;height:8px;border-radius:3px}
.lg-head b{font-size:13px;font-weight:700}
.lg-head span{margin-left:auto;font-size:11px;color:var(--text-dim)}
.match-row{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,transform .15s;box-shadow:var(--shadow-sm)}
.match-row:active{transform:scale(.985);border-color:var(--border-2)}
.mr-left{flex:0 0 62px;display:flex;flex-direction:column;gap:2px}
.mr-left .no{font-size:12px;font-weight:700;color:var(--text)}
.mr-left .tm{font-size:11px;color:var(--text-sub)}
.mr-left .st{font-size:11px;font-weight:700}
.st-up{color:var(--text-dim)} .st-live{color:var(--hit)} .st-end{color:var(--text-sub)}
.mr-mid{flex:1;min-width:0}
.mr-team{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;line-height:1.7;white-space:nowrap;overflow:hidden}
.mr-team .dot{width:7px;height:7px;border-radius:50%;flex:none}
.mr-team .nm{overflow:hidden;text-overflow:ellipsis}
.mr-team .sc{margin-left:auto;font-size:14px;font-weight:800;color:var(--primary-strong)}
.mr-team.away .nm{opacity:.82}
.mr-team .live-min{font-size:11px;font-weight:700;color:var(--hit);margin-left:auto;flex:none}
.mr-odds{flex:0 0 54px;display:flex;flex-direction:column;gap:2px;border-left:1px dashed var(--border);padding-left:10px}
.mr-odds .o{font-size:11px;color:var(--text-sub)}
.mr-odds .o b{font-weight:600;color:var(--text)}
.mr-fav{flex:none;color:var(--text-dim);padding:6px 2px}
.mr-fav.on{color:var(--warn)}

/* ============ 详情页 ============ */
.dtop{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.dtop .back{padding:6px 8px;border-radius:10px;color:var(--text-sub)}
.dtop .back:active{background:var(--surface-2)}
.dtop h2{flex:1;text-align:center;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtop .fav{padding:6px 8px;border-radius:10px;color:var(--text-dim)}
.dtop .fav.on{color:var(--warn)}
.live-card{margin:12px 14px 0;border-radius:18px;overflow:hidden;position:relative;min-height:clamp(230px,33vh,300px);display:flex;flex-direction:column;
  background:linear-gradient(160deg,var(--surface-2),var(--surface) 70%);border:1px solid var(--border)}
.live-card::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 220px at 50% -30%,var(--primary-dim),transparent 70%);pointer-events:none}
.lc-top{display:flex;align-items:center;gap:8px;padding:14px 16px 0;position:relative}
.lc-top .lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-sub);font-weight:600}
.lc-top .st{margin-left:auto;display:flex;align-items:center;gap:6px}
.lc-main{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 16px;position:relative}
.lc-team{flex:0 1 92px;text-align:center;min-width:0}
.lc-team .tname{font-size:13px;font-weight:600;line-height:1.4;word-break:break-all}
.lc-team .tname.sub{color:var(--text-sub);font-weight:500}
.lc-team .trank{font-size:10px;color:var(--text-dim);margin-top:2px}
.lc-score{text-align:center;flex:none}
.lc-score .big{font-size:44px;font-weight:800;font-family:"DIN Alternate","Bahnschrift","Arial Narrow",sans-serif;letter-spacing:1px;line-height:1}
.lc-score .ht{font-size:11px;color:var(--text-sub);margin-top:4px}
.lc-vs{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.lc-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-3);color:var(--text-sub)}
.lc-cd{font-size:12px;font-weight:800;color:var(--primary-strong);letter-spacing:.5px;text-align:center}
.lc-liveinfo{font-size:11px;color:var(--hit);font-weight:700}
.lc-bottom{padding:2px 16px 14px;position:relative}
.lc-stats{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.lc-stat{text-align:center}
.lc-stat .v{font-size:15px;font-weight:800}
.lc-stat .k{font-size:10px;color:var(--text-dim)}
.poss{flex:1;max-width:120px}
.poss .bar{height:5px;border-radius:5px;background:var(--surface-3);overflow:hidden;display:flex}
.poss .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-strong))}
.poss .lab{display:flex;justify-content:space-between;font-size:10px;color:var(--text-sub);margin-bottom:3px}
.lc-events{display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.ev{flex:none;display:flex;align-items:center;gap:5px;font-size:11px;padding:4px 9px;border-radius:999px;background:var(--surface-3);color:var(--text-sub);animation:rv .3s ease}
.ev .d{width:6px;height:6px;border-radius:50%}
.ev.goal .d{background:var(--primary-strong)} .ev.yellow .d{background:var(--warn)} .ev.corner .d{background:var(--info)} .ev.shot .d{background:var(--text-dim)}
.lc-verdict{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:13px}
.lc-verdict .bigver{font-size:20px;font-weight:800}
.lc-verdict .sub{font-size:11px;color:var(--text-sub)}
.lc-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-top:8px}
.subtabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 51px);z-index:15;display:flex;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(14px);padding:8px 14px 0;border-bottom:1px solid var(--border);margin-top:12px}
.subtabs .st{flex:1;text-align:center;padding:8px 0 10px;font-size:13px;font-weight:600;color:var(--text-sub);position:relative}
.subtabs .st.on{color:var(--text)}
.subtabs .st.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:26px;height:3px;border-radius:3px;background:var(--primary)}

/* 前瞻 */
.pv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pv-team{border-radius:12px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border)}
.pv-team h5{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.pv-team h5 .dot{width:6px;height:6px;border-radius:50%}
.form5{display:flex;gap:5px}
.form5 .f{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800}
.form5 .f.w{background:color-mix(in srgb,var(--primary) 18%,transparent);color:var(--primary)}
.form5 .f.d{background:color-mix(in srgb,var(--text-dim) 24%,transparent);color:var(--text-sub)}
.form5 .f.l{background:color-mix(in srgb,var(--hit) 18%,transparent);color:var(--hit)}
.pv-gbar{margin-top:10px}
.pv-gbar .row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-sub);margin-bottom:4px}
.pv-gbar .row .bar{flex:1;height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden;display:flex}
.pv-gbar .row .bar i{height:100%}
.pv-gbar .row .bar .in{background:linear-gradient(90deg,var(--primary),var(--primary-strong))}
.pv-gbar .row .bar .out{background:linear-gradient(90deg,var(--hit),color-mix(in srgb,var(--hit) 60%,transparent))}
.pv-gbar .row b{width:30px;text-align:right;font-weight:700}
.pv-note{font-size:11px;color:var(--text-dim);margin-top:8px;display:flex;align-items:center;gap:4px}
.h2h-list{margin-top:8px}
.h2h-row{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px dashed var(--border);font-size:12px}
.h2h-row:last-child{border-bottom:0}
.h2h-row .date{color:var(--text-dim);width:52px;flex:none;font-size:11px}
.h2h-row .names{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h2h-row .score{font-weight:800}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-size:11px;color:var(--text-dim);font-weight:600;text-align:left;padding:7px 6px;border-bottom:1px solid var(--border)}
.tbl td{padding:8px 6px;border-bottom:1px dashed var(--border);color:var(--text-sub)}
.tbl td:first-child{color:var(--text);font-weight:600}
.tbl .tag{min-width:24px;height:20px;font-size:10px;padding:0 5px}
.tbl .sc{font-weight:800;color:var(--text)}
.inj-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:12px}
.inj-row:last-child{border-bottom:0}
.inj-row .st{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:11px;font-weight:700}
.inj-row .st.gw{background:var(--surface-3);color:var(--text-sub)}
.inj-row .st.ou{background:color-mix(in srgb,var(--hit) 14%,transparent);color:var(--hit)}
.inj-row .nm{font-weight:600;color:var(--text)}
.inj-row .info{font-size:11px;color:var(--text-sub)}
.inj-row .back{margin-left:auto;font-size:11px;color:var(--text-dim)}
.intel li{list-style:none;display:flex;gap:8px;padding:7px 0;font-size:12.5px;color:var(--text-sub);line-height:1.6;border-bottom:1px dashed var(--border)}
.intel li:last-child{border-bottom:0}
.intel li i{flex:none;margin-top:3px;color:var(--primary)}
.intel li b{color:var(--text)}

/* 赔率 */
.odds-sub{display:flex;gap:6px;padding:10px 0;overflow-x:auto}
.odds-sub .o{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--border);color:var(--text-sub);white-space:nowrap}
.odds-sub .o.on{background:var(--primary-dim);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 40%,transparent)}
.odds-row{display:flex;align-items:center;padding:10px 12px;border-bottom:1px dashed var(--border);font-size:13px}
.odds-row:last-child{border-bottom:0}
.odds-row .nm{flex:1;font-weight:600}
.odds-row .init{font-size:11px;color:var(--text-dim);width:44px;text-align:right}
.odds-row .now{width:64px;text-align:right;font-weight:800;font-size:15px}
.odds-row .tr{width:18px;text-align:right;color:var(--text-dim)}

  const wdl=m.odds.wdl.map((o,i)=>{const j=jit(m.id+'w'+i,o);return {nm:['胜','平','负'][i],now:j,init:Math.round(j*(1.03+Math.floor(rng(m.id+i)()*5)*0.01)*100)/100};});

  const hdp=hdpBase.map((o,i)=>{const j=jit(m.id+'h'+i,o);return {nm:['让胜','让平','让负'][i],now:j,init:Math.round(j*1.05*100)/100};});

const histStat=()=>{
  let wdlHit=0,hdpHit=0,scoreHit=0,hfHit=0,totHit=0;

  const n=HIST.length;
  return {n,wdlHit,wdlRate:Math.round(wdlHit/n*100),hdpRate:Math.round(hdpHit/n*100),scoreRate:Math.round(scoreHit/n*100),hfRate:Math.round(hfHit/n*100),totRate:Math.round(totHit/n*100),miss:n-wdlHit};

  const v2='全场'+h.home+'控球率'+poss+'%，共形成'+(8+Math.floor(s()*10))+'次射门（'+(3+Math.floor(s()*4))+'次射正），'+h.away+'依靠'+(4+Math.floor(s()*5))+'次反击制造威胁。角球数对比与赛前情报'+(s()<0.5?'基本吻合':'存在明显偏差')+'。';
  const v3='复盘要点：'+(h.pwdl===h.awdl?'模型对主场定位的权重设置合理，可继续沿用同参数策略；':'本场提示需上调平局权重、弱化排名假设；')+'下一阶段将把伤停名单与临场轮换纳入置信度修正因子。';
  return [verdict,v1,v2,v3];
}

const fmtDT=iso=>{const d=new Date(iso);return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function dayLabel(iso){const d=new Date(iso),n=new Date();const t=new Date(n.getFullYear(),n.getMonth(),n.getDate());const k=new Date(d.getFullYear(),d.getMonth(),d.getDate());const diff=Math.round((k-t)/864e5);return diff===0?'今日':diff===1?'明日':diff<0?'完场':fmtDT(iso)}

function ring(pct,size,sw,color){const r=(size-sw)/2,c=2*Math.PI*r,off=c*(1-pct/100);return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color||'var(--primary)'}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`}

function matchGroups(list,showDate){
  const groups={};

      :`<div class="lg-head"><span class="dot" style="background:${colOf(arr[0].home)}"></span><b>${g}</b><span>${arr.length}场</span></div>`;
    return `<div class="lg-group rv">${head}${arr.map(m=>matchRow(m,showDate)).join('')}</div>`;
  }).join('');
}

/* ============ 路由 / 渲染 ============ */
const Stack=[];
function pushRoute(route,id){Stack.push({route:S.route,params:S.params});S.route=route;S.params=[id]}
function goBack(){const p=Stack.pop();if(p){S.route=p.route;S.params=p.params}else{S.route='matches';S.params=[]}render()}
function render(){
  const root=S.route==='matches'?'matches':(S.route==='analysis'||S.route==='result')?'analysis':'mine';
  document.querySelectorAll('#tabbar .tab-btn').forEach(b=>b.classList.toggle('on',b.dataset.v===root));
  let html='';
  if(S.route==='matches')html=viewMatches();
  else if(S.route==='analysis')html=viewPrediction();
  else if(S.route==='mine')html=viewMine();
  else if(S.route==='detail')html=viewDetail(S.params[0]);
  else if(S.route==='result')html=viewResult(S.params[0]);
  viewEl().innerHTML=html||'<div class="empty"><p>页面不存在</p></div>';
  const si=$('#searchInput');if(si)si.value=S.search;
  const panel=$('#searchPanel'),sb=$('#searchbar'),bd=$('#spBackdrop');
  if(panel){panel.innerHTML=searchPanelHTML(S.search);panel.classList.toggle('show',!!S.search)}
  if(sb)sb.classList.toggle('has',!!S.search);
  if(bd)bd.classList.toggle('show',!!S.search);
  refreshCD();
}

/* ============ 事件 ============ */
document.addEventListener('click',e=>{
  if(e.target&&e.target.id==='spBackdrop'){S.search='';render();return}
  const btn=e.target.closest('[data-act]');if(!btn)return;
  const act=btn.dataset.act,v=btn.dataset.v,id=btn.dataset.id;
  if(act==='nav'){S.route=v;S.params=[];Stack.length=0;render()}
  else if(act==='cat'){S.tab=v;render()}
  else if(act==='open'){pushRoute('detail',id);render()}
  else if(act==='resopen'){pushRoute('result',id);render()}
  else if(act==='fav'){toggleFav(id)}
  else if(act==='mtab'){S.mtab=v;render()}
  else if(act==='otab'){S.otab=v;render()}
  else if(act==='back'){goBack()}
  else if(act==='sgo'){
    S.search='';
    if(btn.dataset.type==='match'){pushRoute('detail',btn.dataset.id);render()}
    else if(btn.dataset.type==='league'){S.filter={type:'league',value:v,label:v};S.route='matches';S.tab='today';render()}
    else if(btn.dataset.type==='team'){S.filter={type:'team',value:v,label:v};S.route='matches';S.tab='today';render()}
    else {S.filter={type:'player',team:btn.dataset.team,label:v+'（'+btn.dataset.team+'）'};S.route='matches';S.tab='today';render()}
  }
  else if(act==='sclr'){S.search='';render()}
  else if(act==='clr'){S.filter=null;render()}
  else if(act==='theme'){setTheme(v)}
});
document.addEventListener('input',e=>{
  if(e.target&&e.target.id==='searchInput'){
    S.search=e.target.value;
    const panel=$('#searchPanel'),sb=$('#searchbar'),bd=$('#spBackdrop');
    if(panel){panel.innerHTML=searchPanelHTML(S.search);panel.classList.toggle('show',!!S.search)}
    if(sb)sb.classList.toggle('has',!!S.search);
    if(bd)bd.classList.toggle('show',!!S.search);
  }
});
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('jc_theme',t)}catch(e){}render()}

/* ============ 实时模拟 ============ */
function refreshCD(){document.querySelectorAll('.cd[data-kick]').forEach(el=>{el.textContent=cdText(el.dataset.kick)})}
function tickLive(){
  M.forEach(m=>{
    if(m.status!=='live')return;
    const L=m.live;
    if(L.minute<90){
      L.minute++;const d=document.querySelector(`[data-lm-min="${m.id}"]`);if(d)d.textContent=L.minute+"'";
      if(Math.random()<0.55){
        const t=Math.random()<0.55?1:0;
        const roll=Math.random();
        const pn=pick(PLAYERS,rng(m.id+'ev'+L.events.length));
        let type,txt;
        if(roll<0.16){type='goal';L.score[t]++;txt=pn.n+'破门'}
        else if(roll<0.32){type='yellow';L.cards[t]++;txt=pn.n+'染黄'}
        else if(roll<0.55){type='corner';L.corners[t]++;txt='角球机会'}
        else {type='shot';L.shots[t]++;txt=pn.n+'射门'}
        L.events.push({m:L.minute,t,type,txt});if(L.events.length>8)L.events.shift();
        L.possession=[Math.min(80,Math.max(20,L.possession[0]+Math.floor(Math.random()*5)-2)),0];
        L.possession[1]=100-L.possession[0];
        const ev=document.querySelector(`[data-lm-events="${m.id}"]`);
        if(ev)ev.innerHTML=L.events.slice(-4).map(x=>`<span class="ev ${x.type}"><span class="d"></span>${x.m}' ${x.txt}</span>`).join('');
        const sc=document.querySelector(`[data-lm-score="${m.id}"]`);if(sc)sc.textContent=L.score[0]+':'+L.score[1];
        const cr=document.querySelector(`[data-lm-corners="${m.id}"]`);if(cr)cr.textContent=L.corners[0]+':'+L.corners[1];
        const sh=document.querySelector(`[data-lm-shots="${m.id}"]`);if(sh)sh.textContent=L.shots[0]+':'+L.shots[1];
        const p1=document.querySelector(`[data-lm-p1="${m.id}"]`),p2=document.querySelector(`[data-lm-p2="${m.id}"]`),pb=document.querySelector(`[data-lm-pbar="${m.id}"]`);
        if(p1)p1.textContent=L.possession[0]+'%';
        if(p2)p2.textContent=L.possession[1]+'%';
        if(pb)pb.style.width=L.possession[0]+'%';
      }
    }
  });
  refreshCD();
}

/* ============ 启动 ============ */
render();
setInterval(tickLive,8000);
setTimeout(()=>toast('欢迎使用竞彩足球预测原型'),600);
</script>
